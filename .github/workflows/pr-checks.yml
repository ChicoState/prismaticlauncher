name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux validation image
        run: docker build --pull=false -f Dockerfile.ci -t prismaticlauncher-ci:ci .
      - name: Run Linux validation
        run: docker run --rm prismaticlauncher-ci:ci
      - name: Run infrastructure smoke test
        run: docker run --rm --entrypoint bash prismaticlauncher-ci:ci -lc ./scripts/verify-infrastructure.sh
      - name: Check formatting
        run: docker run --rm --entrypoint bash prismaticlauncher-ci:ci -lc ./scripts/format-check.sh
      - name: Run static analysis
        run: docker run --rm --entrypoint bash prismaticlauncher-ci:ci -lc ./scripts/static-analysis.sh
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostics
          path: |
            coverage/
            build/
          if-no-files-found: ignore

  native-build:
    name: Native CMake validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v7
      - name: Configure CMake
        run: cmake --preset dev
      - name: Build CMake targets
        run: cmake --build --preset dev
      - name: Discover CTest tests
        run: ctest --preset dev --show-only=json-v1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Check for C/C++ source
        id: source-check
        shell: bash
        run: |
          if [[ -d src ]] && find src -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            -print -quit | grep -q .; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No C/C++ source found; skipping CodeQL."
          fi
      - uses: github/codeql-action/init@v3
        if: steps.source-check.outputs.has_source == 'true'
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        if: steps.source-check.outputs.has_source == 'true'
